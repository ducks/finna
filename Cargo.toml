[package]
name = "finna"
version = "20260222.0.0"
edition = "2021"
description = "Multi-model debate, spec, and implement tool for AI-assisted development"
license = "MIT"
repository = "https://github.com/ducks/finna"
keywords = ["ai", "llm", "development", "multi-model", "code-generation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
